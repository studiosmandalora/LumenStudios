      <stop offset="0%" style="stop-color:#1C2F63"/>
      <stop offset="100%" style="stop-color:#15171B"/>
    </linearGradient>
  </defs>
  <rect width="600" height="750" fill="url(#bg8)"/>
  <!-- Waveform bars -->
  <g opacity="0.12" fill="#B9C6E8">
    <rect x="150" y="360" width="8" height="30" rx="4"/>
    <rect x="170" y="340" width="8" height="70" rx="4"/>
    <rect x="190" y="320" width="8" height="110" rx="4"/>
    <rect x="210" y="330" width="8" height="90" rx="4"/>
    <rect x="230" y="350" width="8" height="50" rx="4"/>
    <rect x="250" y="310" width="8" height="130" rx="4"/>
    <rect x="270" y="325" width="8" height="100" rx="4"/>
    <rect x="290" y="340" width="8" height="70" rx="4"/>
    <rect x="310" y="355" width="8" height="40" rx="4"/>
    <rect x="330" y="335" width="8" height="80" rx="4"/>
    <rect x="350" y="345" width="8" height="60" rx="4"/>
    <rect x="370" y="360" width="8" height="30" rx="4"/>
    <rect x="390" y="370" width="8" height="10" rx="4"/>
    <rect x="410" y="340" width="8" height="70" rx="4"/>
    <rect x="430" y="350" width="8" height="50" rx="4"/>
