  <!-- Play button -->
  <circle cx="300" cy="375" r="40" fill="none" stroke="#B9C6E8" stroke-width="2" opacity="0.3"/>
  <polygon points="290,355 290,395 320,375" fill="#B9C6E8" opacity="0.3"/>
  <text x="300" y="650" text-anchor="middle" font-family="'Big Shoulders Display', Impact, sans-serif" font-weight="700" font-size="24" fill="#FFFFFF" opacity="0.15" letter-spacing="4">MUSIC VIDEO</text>
</svg>